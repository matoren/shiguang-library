<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>手机布局验收</title><style>body{margin:0;background:#e4e5df;font:14px sans-serif}header{padding:10px;display:flex;gap:5px;flex-wrap:wrap}button{min-height:32px}iframe{border:0;margin:0 18px;background:white;height:800px;box-shadow:0 5px 30px #0002}pre{white-space:pre-wrap;margin:18px}</style><header><button data-w="320">320 px</button><button data-w="360">360 px</button><button data-w="412">412 px</button><button data-route="home">首页</button><button data-route="book">书籍</button><button data-route="movie">电影</button><button data-route="game">游戏</button><button data-route="me">我的</button><button data-route="rank">排行榜</button><button data-route="settings">设置</button><button id="add">添加作品</button><button id="open-search">打开联网搜索</button><button id="close">关闭弹窗</button><button id="measure">测量</button></header><iframe title="手机应用预览" width="360" src="../#home"></iframe><pre id="result"></pre><script>const f=document.querySelector('iframe');function measure(){const d=f.contentDocument,dialog=[...d.querySelectorAll('dialog[open]')].map(el=>({id:el.id,width:el.clientWidth,content:el.scrollWidth,overflow:el.scrollWidth>el.clientWidth}));document.querySelector('#result').textContent=JSON.stringify({viewport:d.documentElement.clientWidth,content:d.documentElement.scrollWidth,horizontalOverflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,dialogs:dialog,brand:d.title},null,2)}f.onload=measure;document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{f.width=b.dataset.w;requestAnimationFrame(measure)});document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{f.contentWindow.location.hash=b.dataset.route;requestAnimationFrame(measure)});document.querySelector('#add').onclick=()=>{f.contentDocument.querySelector('#add').click();measure()};document.querySelector('#open-search').onclick=()=>{f.contentDocument.querySelector('#online-search')?.click();measure()};document.querySelector('#close').onclick=()=>{f.contentDocument.querySelectorAll('dialog[open]').forEach(d=>d.close());measure()};document.querySelector('#measure').onclick=measure;</script></html>
