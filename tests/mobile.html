<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>手机布局验收</title><style>body{margin:0;background:#e4e5df;font:14px sans-serif}header{padding:12px}iframe{border:0;margin:0 18px;background:white;height:800px;box-shadow:0 5px 30px #0002}pre{white-space:pre-wrap;margin:18px}</style><header>手机视口模拟 · <button data-w="320">320 px</button> <button data-w="360">360 px</button> <button data-w="412">412 px</button> <button id="book">书架</button> <button id="settings">设置</button> <button id="add">新增书籍</button> <button id="close">关闭表单</button> <button id="measure">测量</button></header><iframe title="手机应用预览" width="360" src="../#home"></iframe><pre id="result"></pre><script>const f=document.querySelector('iframe');function measure(){const d=f.contentDocument;document.querySelector('#result').textContent=JSON.stringify({viewport:d.documentElement.clientWidth,content:d.documentElement.scrollWidth,horizontalOverflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,dialogOverflow:d.querySelector('#editor')?.open?d.querySelector('#editor').scrollWidth>d.querySelector('#editor').clientWidth:false},null,2)}f.onload=measure;document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{f.width=b.dataset.w;requestAnimationFrame(measure)});document.querySelector('#book').onclick=()=>f.src='../#book';document.querySelector('#settings').onclick=()=>f.src='../#settings';document.querySelector('#add').onclick=()=>{f.contentDocument.querySelector('#add').click();measure()};document.querySelector('#close').onclick=()=>f.contentDocument.querySelector('#editor').close();document.querySelector('#measure').onclick=measure;</script></html>
