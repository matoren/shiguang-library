<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>电影剧集与指南兼容测试</title><h1>独立临时数据库验收</h1><p>不读取或修改个人收藏数据库。</p><pre id="results">运行中…</pre><script type="module">
import {openDB,readAll,commit} from '../db.js';import {backup,validateBackup,defaults,MOVIE_WEIGHTS,ranked,stats,screenKind,applyCandidate} from '../core.js';import {ratingGuide} from '../guides.js';
const output=document.querySelector('#results'),logs=[],name='series-qa-'+crypto.randomUUID();let db,restoreDB;const check=(ok,label)=>{if(!ok)throw Error(label);logs.push('通过：'+label);output.textContent=logs.join('\n');};
try{const canvas=document.createElement('canvas');canvas.width=canvas.height=10;canvas.getContext('2d').fillRect(0,0,10,10);const image=canvas.toDataURL();const film={id:'old',type:'movie',title:'旧电影',creator:'旧导演',country:'旧国家',year:'1994',category:'剧情',status:'已看',date:'2026-01-01',tags:['旧标签'],scores:[8,9,7,8],weights:MOVIE_WEIGHTS,computed:8.1,final:6.9,mode:'standard',quick:null,adjusted:true,manual:6.9,ruleVersion:1,comment:'旧评论',cover:image,thumb:image,created:'2026-01-01T00:00:00Z',updated:'2026-01-01T00:00:00Z',legacy:{keep:true}},series={...film,id:'series',screenType:'series',title:'剧集',year:'2015',adjusted:false,manual:null,final:8.1};
db=await openDB(name);await commit(db,[film],defaults());db.close();db=await openDB(name);let saved=await readAll(db);check(JSON.stringify(saved.records[0])===JSON.stringify(film),'旧电影逐字段保留，无新增字段或评分重算');check(screenKind(saved.records[0])==='film','旧电影默认电影');await commit(db,[...saved.records,series],saved.settings);check((await readAll(db)).records.length===2,'新增剧集与电影共存');const edited=applyCandidate(series,{type:'movie',screenType:'series',title:'编辑剧集',year:'2016'});check(edited.comment===series.comment&&edited.final===8.1&&edited.cover===image,'剧集编辑填充保留评分评论封面');await commit(db,[film,edited],defaults());check(ranked([film,edited],'movie','','','series')[0].id==='series','剧集分类排行');check(stats([film,edited],'movie',2026,'film').average==='6.9','电影独立平均分');const exported=JSON.stringify(backup((await readAll(db)).records,defaults()));const parsed=validateBackup(JSON.parse(exported));restoreDB=await openDB(name+'-restore');await commit(restoreDB,parsed.records,parsed.settings);check(JSON.stringify((await readAll(restoreDB)).records)===JSON.stringify((await readAll(db)).records),'新备份在另一独立数据库完整恢复，两种类型和兼容字段一致');check(validateBackup(backup([film],defaults())).records[0].screenType===undefined,'旧版备份仍导入且不重写');const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=parsed.records[1].cover;});check(img.naturalWidth===10,'剧集恢复后封面实际解码');const before=JSON.stringify(film);for(const kind of ['film','series'])for(let i=0;i<4;i++)check(ratingGuide('movie',i,'',kind).bands.length===5,kind+'维度'+i+'离线指南完整');check(JSON.stringify(film)===before,'查看全部指南无评分和记录副作用');output.textContent+='\n全部 '+logs.length+' 项通过';document.body.dataset.result='pass';}catch(e){output.textContent+='\n失败：'+e.stack;document.body.dataset.result='fail';}finally{db?.close();restoreDB?.close();indexedDB.deleteDatabase(name);indexedDB.deleteDatabase(name+'-restore');}
</script></html>
