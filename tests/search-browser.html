<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>搜索故障降级与缓存验收</title><h1>真实浏览器故障注入验收</h1><p>测试使用注入的模拟网络故障，不代表大陆网络实测；不读取或修改收藏数据库。</p><pre id="results">运行中…</pre><script type="module">
import {requestJSON,SearchError} from '../online.js';import {searchAcross,metadataCache,externalSearches,boundedSource} from '../search-policy.js';
const out=document.querySelector('#results'),logs=[],none={get:()=>null,put:()=>{}},budgets={bangumi:30,wikidata:30,openlibrary:30,ndl:30};const check=(ok,name)=>{if(!ok)throw Error(name);logs.push('通过：'+name);out.textContent=logs.join('\n');},candidate={type:'book',title:'模拟候选',source:{provider:'测试'}};
try{let calls=[];let result=await searchAcross('book','测试',{cache:none,budgets,runner:async(t,q,p)=>{calls.push(p);return p==='ndl'?new Promise(()=>{}):[candidate];}});check(result.items.length===1&&calls.join(',')==='ndl,openlibrary','主源挂起达到上限后仅切换一次备用');check(result.attempts[0].code==='timeout','主源超时保留错误原因');result=await searchAcross('game','测试',{cache:none,runner:async()=>{throw new SearchError('network','网络或跨域限制');}});check(result.items.length===0&&result.attempts.every(a=>a.state==='error'),'所有接口失败不伪装无结果');result=await searchAcross('book','测试',{cache:none,runner:async()=>[]});check(result.attempts.every(a=>a.state==='empty'),'空结果单独标注请求成功');let code='';try{await requestJSON('https://test.invalid/body',null,async()=>({ok:true,json:()=>new Promise(()=>{})}),{timeoutMs:30,stage:'读取正文'});}catch(e){code=e.code;}check(code==='timeout','响应正文挂起也会超时');try{await requestJSON('https://test.invalid/cors',null,async()=>{throw TypeError('Failed to fetch');});}catch(e){check(e.code==='network'&&e.message.includes('跨域'),'浏览器通用网络失败提示包含跨域可能性，不虚构根因');}const ctl=new AbortController();calls=[];try{await searchAcross('book','测试',{cache:none,signal:ctl.signal,runner:async(t,q,p)=>{calls.push(p);ctl.abort();throw Error();}});}catch{}check(calls.length===1,'取消后不再请求备用');const map=new Map(),storage={getItem:k=>map.get(k),setItem:(k,v)=>map.set(k,v)},cache=metadataCache(storage);await searchAcross('book','缓存',{cache,runner:async()=>[candidate]});result=await searchAcross('book','缓存',{cache:metadataCache(storage),offline:true,runner:async()=>{throw Error();}});check(result.fromCache&&result.items[0].title==='模拟候选','缓存跨实例可读，离线不联网');let refreshed=0;await searchAcross('book','缓存',{cache,refresh:true,runner:async()=>{refreshed++;return [candidate];}});check(refreshed===1,'用户可强制联网刷新');result=await searchAcross('game','未缓存',{cache:none,offline:true});check(result.attempts[0].code==='offline','离线无缓存给出明确提示');check(externalSearches('book','羊脂球 & ?').every(l=>new URL(l.url).protocol==='https:'),'外部核对链接始终可生成且编码中文');check(!JSON.stringify([...map.values()]).includes('scores')&&!JSON.stringify([...map.values()]).includes('comment'),'缓存不混入用户评分或评论');out.textContent+='\n全部 '+logs.length+' 项通过';document.body.dataset.result='pass';}catch(e){out.textContent+='\n失败：'+e.stack;document.body.dataset.result='fail';}
</script></html>
