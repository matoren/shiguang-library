<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>备份文件独立恢复验收</title><h1>备份文件独立恢复验收</h1><p>只读取所选文件，并恢复到新建的独立临时数据库。不连接或修改收藏应用的数据库。</p><label style="display:inline-block;padding:12px;border:1px solid #aaa;cursor:pointer">选择验收备份<input id="file" type="file" accept=".json" hidden></label><pre id="result">等待选择文件</pre><script type="module">
import {openDB,readAll,commit} from '../db.js?backup-verification=2';import {validateBackup} from '../core.js?backup-verification=2';
const out=document.querySelector('#result');document.querySelector('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;let db;const name='remember-restore-verification-'+crypto.randomUUID();try{out.textContent='校验中…';const data=validateBackup(JSON.parse(await file.text()));db=await openDB(name);if((await readAll(db)).records.length)throw Error('临时数据库非空，停止操作');await commit(db,data.records,data.settings);let saved=await readAll(db);const stable=rs=>JSON.stringify([...rs].sort((a,b)=>a.id.localeCompare(b.id)));if(stable(saved.records)!==stable(data.records))throw Error('记录恢复不一致');if(JSON.stringify(saved.settings)!==JSON.stringify(data.settings))throw Error('设置恢复不一致');let images=0;for(const src of new Set(saved.records.flatMap(r=>[r.cover,r.thumb]).filter(Boolean))){await new Promise((resolve,reject)=>{const i=new Image();i.onload=resolve;i.onerror=()=>reject(Error('封面解码失败'));i.src=src;});images++;}db.close();db=await openDB(name);if(stable((await readAll(db)).records)!==stable(data.records))throw Error('重开数据库后数据不一致');out.textContent=JSON.stringify({result:'通过',records:saved.records.length,types:[...new Set(saved.records.map(r=>r.type))],imagesDecoded:images,allScoresAndCommentsPreserved:true,settingsPreserved:true,originalAppDatabaseUntouched:true},null,2);document.body.dataset.result='pass';}catch(err){out.textContent='失败：'+err.message;document.body.dataset.result='fail';}finally{db?.close();indexedDB.deleteDatabase(name);}};
</script></html>
