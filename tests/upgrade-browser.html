<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>升级兼容性验收</title><h1>升级兼容性验收</h1><p>仅使用独立临时数据库，不触碰个人收藏。</p><pre id="results">运行中…</pre><script type="module">
import {openDB,readAll,commit} from '../db.js?upgrade=2';import {WEIGHTS,GAME_WEIGHTS,calculate,defaults,backup,validateBackup,applyCandidate,featured,ranked} from '../core.js?upgrade=2';
const results=document.querySelector('#results'),logs=[],name='remember-upgrade-test-'+crypto.randomUUID();let db;function check(ok,label){if(!ok)throw Error(label);logs.push('通过：'+label);results.textContent=logs.join('\n');}
try{const c=document.createElement('canvas');c.width=c.height=8;c.getContext('2d').fillRect(0,0,8,8);const image=c.toDataURL('image/png');const base={title:'升级兼容记录',creator:'原作者',country:'原国家',year:'1902',category:'文学小说',tags:['旧标签'],status:'已读',date:'2026-10-27',comment:'原评论必须保留',scores:[9,8,8,7,8,9],weights:WEIGHTS[0],mode:'standard',quick:null,manual:6.9,adjusted:true,computed:8.3,final:6.9,ruleVersion:1,cover:image,thumb:image,created:'2026-10-27T00:00:00Z',updated:'2026-10-27T00:00:00Z'};
const oldBook={...base,id:'book-old',type:'book',legacy:{foo:'原扩展字段'}};const oldMovie={...base,id:'movie-old',type:'movie',category:'剧情',status:'已看',year:'1994',scores:[8,9,7,8],weights:GAME_WEIGHTS,computed:8.1};const game={...oldMovie,id:'game-old',type:'game',status:'已通关',platform:'旧平台',hours:123,developer:'兼容开发商'};const original=[oldBook,oldMovie,game],settings=defaults();settings.weights[0]=[20,25,20,10,15,10];settings.ruleVersion=2;
await new Promise((resolve,reject)=>{const q=indexedDB.open(name,1);q.onupgradeneeded=()=>{q.result.createObjectStore('records',{keyPath:'id'});q.result.createObjectStore('settings');};q.onsuccess=()=>{const legacy=q.result,t=legacy.transaction(['records','settings'],'readwrite');original.forEach(r=>t.objectStore('records').put(r));t.objectStore('settings').put(settings,'preferences');t.oncomplete=()=>{legacy.close();resolve();};t.onabort=()=>reject(t.error);};q.onerror=()=>reject(q.error);});
db=await openDB(name);let saved=await readAll(db);check(db.version===1,'数据库版本维持 1，无破坏性迁移');check(JSON.stringify(saved.records.sort((a,b)=>a.id.localeCompare(b.id)))===JSON.stringify([...original].sort((a,b)=>a.id.localeCompare(b.id))),'打开新版后旧记录逐字段完全一致');check(JSON.stringify(saved.settings)===JSON.stringify(settings),'自定义权重和设置完全保留');
const oldBackup=backup([oldBook,oldMovie],settings);check(validateBackup(oldBackup).records[0].year==='1902','旧 v1 书籍出版年份内部保留并可导入');const filled=applyCandidate(oldBook,{type:'book',title:'羊脂球',creator:'莫泊桑',year:'1880',country:'法国',source:{provider:'Wikidata'}});check(filled.year==='1902'&&filled.country==='原国家','填充不误写书籍年份或国家');check(JSON.stringify(filled.scores)===JSON.stringify(oldBook.scores)&&filled.final===6.9&&filled.computed===8.3&&filled.comment===oldBook.comment,'搜索填充不改原评分或评论');check(filled.cover===image&&filled.thumb===image,'无搜索图片时保留原封面');
const gameFilled=applyCandidate(game,{type:'game',title:'新的游戏名称',creator:'开发商',year:'2023',category:'动作',hours:0,platform:'新平台'});check(gameFilled.platform==='旧平台'&&gameFilled.hours===123,'旧游戏平台和时长作为兼容字段保留');await commit(db,[filled,oldMovie,gameFilled],settings);saved=await readAll(db);check(saved.records.length===3,'编辑后全部三类记录仍在');check(saved.records.find(r=>r.id==='game-old').comment===game.comment,'游戏编辑后评论、评分未被覆盖');const exported=JSON.stringify(backup(saved.records,saved.settings)),restored=validateBackup(JSON.parse(exported));await commit(db,[],defaults());await commit(db,restored.records,restored.settings);check(JSON.stringify((await readAll(db)).records.sort((a,b)=>a.id.localeCompare(b.id)))===JSON.stringify(saved.records.sort((a,b)=>a.id.localeCompare(b.id))),'三类数据与封面完整导出恢复一致');
const imageView=new Image();await new Promise((resolve,reject)=>{imageView.onload=resolve;imageView.onerror=reject;imageView.src=(restored.records[0].cover);});check(imageView.naturalWidth===8,'恢复封面实际可解码');const before=JSON.stringify((await readAll(db)).records);try{await commit(db,[{...oldBook,invalid:()=>{}}],settings);}catch{}check(JSON.stringify((await readAll(db)).records)===before,'新版非清空写入发生错误时原数据完整回滚');db.close();db=await openDB(name);check((await readAll(db)).records.length===3,'关闭重开后完整数据继续保留');check(ranked(restored.records,'game').length===1&&featured(restored.records).length===3,'排行榜与精选支持完成游戏及全部三类作品');results.textContent+='\n\n全部 15 项升级集成测试通过';document.body.dataset.result='pass';}catch(e){results.textContent+='\n失败：'+e.stack;document.body.dataset.result='fail';}finally{db?.close();indexedDB.deleteDatabase(name);}
</script></html>
