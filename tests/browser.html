<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>IndexedDB 集成测试</title><h1>真实浏览器存储集成测试</h1><p>仅操作独立测试数据库，不访问用户收藏馆。</p><pre id="results">运行中…</pre><script type="module">
import {openDB,readAll,commit} from '../db.js';import {defaults,WEIGHTS,calculate,backup,validateBackup,mergeRecords} from '../core.js';
const out=document.querySelector('#results');const logs=[];const name='shiguang-test-'+crypto.randomUUID();let db;
function check(ok,label){if(!ok)throw Error(label);logs.push('通过：'+label);out.textContent=logs.join('\n');}
try{db=await openDB(name);const r={id:crypto.randomUUID(),type:'book',title:'存储测试',creator:'测试作者',country:'中国',year:'2026',category:'文学小说',tags:['测试'],status:'已读',date:'2026-10-27',comment:'封面和评论恢复',scores:[9,8,8,7,8,9],weights:WEIGHTS[0],mode:'standard',quick:null,manual:6.9,adjusted:true,computed:8.3,final:6.9,ruleVersion:1,cover:null,thumb:null,created:new Date().toISOString(),updated:new Date().toISOString()};const c=document.createElement('canvas');c.width=c.height=10;c.getContext('2d').fillRect(0,0,10,10);r.cover=r.thumb=c.toDataURL('image/png');let settings=defaults();settings.weights[0]=[20,25,20,10,15,10];settings.ruleVersion=2;
await commit(db,[r],settings);let saved=await readAll(db);check(saved.records.length===1&&saved.records[0].cover===r.cover,'新增记录与封面写入 IndexedDB');db.close();db=await openDB(name);saved=await readAll(db);check(saved.records[0].final===6.9&&saved.settings.ruleVersion===2,'关闭重开数据库保留记录与设置');
const exported=JSON.stringify(backup(saved.records,saved.settings));const recovered=validateBackup(JSON.parse(exported));await commit(db,[],defaults());check((await readAll(db)).records.length===0,'清空独立测试库');await commit(db,recovered.records,recovered.settings);saved=await readAll(db);check(JSON.stringify(saved.records)===JSON.stringify(recovered.records),'完整恢复数量、评分、评论和封面字节');check(JSON.stringify(saved.settings)===JSON.stringify(settings),'完整恢复自定义权重与设置');await new Promise((resolve,reject)=>{const i=new Image();i.onload=resolve;i.onerror=reject;i.src=saved.records[0].cover;});check(true,'恢复后的封面可以实际解码显示');
const merged=mergeRecords(saved.records,recovered.records);await commit(db,merged.records,settings);check((await readAll(db)).records.length===1&&merged.conflicts.length===1,'重复备份合并不增加记录');const invalid=JSON.parse(exported);invalid.records[0].final=99;try{validateBackup(invalid);throw Error('校验未拒绝');}catch(e){if(e.message==='校验未拒绝')throw e;}check(JSON.stringify((await readAll(db)).records)===JSON.stringify(saved.records),'导入校验失败不改变已有数据');
const edited={...r,comment:'已修改'};await commit(db,[edited],settings);check((await readAll(db)).records[0].comment==='已修改','编辑可靠保存');
try{await commit(db,[{...r,nonClone:()=>{}}],settings);}catch{}check((await readAll(db)).records[0].comment==='已修改','写入中途失败时事务回滚，不清空原记录');await commit(db,[],settings);check((await readAll(db)).records.length===0,'删除可靠保存');out.textContent+='\n\n全部 11 项集成测试通过';document.body.dataset.result='pass';
}catch(e){out.textContent+='\n失败：'+e.stack;document.body.dataset.result='fail';}finally{db?.close();indexedDB.deleteDatabase(name);}
</script></html>
